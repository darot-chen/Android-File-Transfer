name: AndroidFileTransfer
options:
  bundleIdPrefix: com.darot
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AndroidFileTransfer:
    type: application
    platform: macOS
    sources:
      - path: AndroidFileTransfer
        excludes:
          - "Resources/adb"
      - path: AndroidFileTransfer/Resources/adb
        buildPhase: resources
    info:
      path: AndroidFileTransfer/Info.plist
      properties:
        CFBundleDisplayName: Android File Transfer
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Personal use only.
        NSPrincipalClass: NSApplication
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - AndroidFileTransferTests
        - AndroidFileTransferUITests
      commandLineArguments: {}

  AndroidFileTransferTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AndroidFileTransferTests
    dependencies:
      - target: AndroidFileTransfer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  AndroidFileTransferUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: AndroidFileTransferUITests
    dependencies:
      - target: AndroidFileTransfer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
